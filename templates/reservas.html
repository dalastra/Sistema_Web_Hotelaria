<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <div class="container">

        <nav>
            <a href="/">Home</a>
            <a href="/hospedes">Hóspedes</a>
            <a href="/quartos">Quartos</a>
            <a href="/reservas">Reservas</a>
        </nav>

        <h1>Lista de Reservas</h1>

        <a href="/add_reserva">
            Nova Reserva
        </a>

        {% for reserva in reservas %}

        <div class="card">

            <p>
                <strong>Hóspede:</strong>
                {{ reserva[1] }}
            </p>

            <p>
                <strong>Quarto:</strong>
                {{ reserva[2] }}
            </p>

            <p>
                <strong>Entrada:</strong>
                {{ reserva[3] }}
            </p>

            <p>
                <strong>Saída:</strong>
                {{ reserva[4] }}
            </p>

            <div class="actions">

                <a href="/reserva/{{ reserva[0] }}">
                    Visualizar
                </a>

                <a href="/edit_reserva/{{ reserva[0] }}">
                    Editar
                </a>

                <a href="/delete_reserva/{{ reserva[0] }}">
                    Excluir
                </a>

            </div>

        </div>

        {% endfor %}

    </div>

</body>

</html>
