<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Quarto</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <h1>Editar Quarto</h1>

    <form action="/edit_quarto/{{ quarto[0] }}" method="post">

        <input
            type="text"
            name="numero"
            value="{{ quarto[1] }}"
        >

        <br><br>

        <input
            type="text"
            name="tipo"
            value="{{ quarto[2] }}"
        >

        <br><br>

        <input
            type="number"
            step="0.01"
            name="valor_diaria"
            value="{{ quarto[3] }}"
        >

        <br><br>

        <input
            type="text"
            name="status"
            value="{{ quarto[4] }}"
        >

        <br><br>

        <button type="submit">
            Salvar
        </button>

    </form>

</body>
</html>
