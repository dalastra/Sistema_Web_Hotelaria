<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>edit_quarto</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">


    <h1>Editar Quarto</h1>

    <form class="card" action="/edit_quarto/{{ quarto[0] }}" method="post">

        <input
            type="text"
            name="numero"
            value="{{ quarto[1] }}"
        >

        

        <input
            type="text"
            name="tipo"
            value="{{ quarto[2] }}"
        >

        

        <input
            type="number"
            step="0.01"
            name="valor_diaria"
            value="{{ quarto[3] }}"
        >

        

        <input
            type="text"
            name="status"
            value="{{ quarto[4] }}"
        >

        

        <button type="submit">
            Salvar
        </button>

    </form>


    </div>
</body>
</html>
